<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Control de Biblioteca</title>
    <style>
        /* --- VARIABLES DE DISEÑO (Copia tus colores de Figma aquí) --- */
        :root {
            --bg-principal: #f4f6f9;
            --bg-tarjeta: #ffffff;
            --color-primario: #4f46e5; /* El color de tus botones principales en Figma */
            --color-texto: #1f2937;
            --color-borde: #e5e7eb;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-principal);
            color: var(--color-texto);
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        header {
            margin-bottom: 30px;
        }

        /* --- LAYOUT EN MALLA (Para organizar tus secciones) --- */
        .dashboard {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .dashboard {
                grid-template-columns: 1fr;
            }
        }

        /* --- COMPONENTES (Estilízalos como tus capas de Figma) --- */
        .card {
            background-color: var(--bg-tarjeta);
            padding: 20px;
            border-radius: 12px; /* Ajusta según el Corner Radius de Figma */
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border: 1px solid var(--color-borde);
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--color-borde);
            border-radius: 6px;
            box-sizing: border-box;
        }

        .btn {
            background-color: var(--color-primario);
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }

        .btn:hover {
            opacity: 0.9;
        }

        /* --- TABLA / LISTA DE LIBROS --- */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th, td {
            text-align: left;
            padding: 12px;
            border-bottom: 1px solid var(--color-borde);
        }

        th {
            background-color: #f8fafc;
        }

        .status {
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: bold;
        }

        .status-disponible { background-color: #dcfce7; color: #15803d; }
        .status-prestado { background-color: #fee2e2; color: #b91c1c; }

        .btn-action {
            background: none;
            border: none;
            color: var(--color-primario);
            cursor: pointer;
            text-decoration: underline;
            padding: 0;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Sistema de Control de Biblioteca</h1>
        <p>Control de libros UPALT.</p>
    </header>

    <div class="dashboard">
        <!-- Columna Izquierda: Formulario (Figma: Sidebar o Panel de Registro) -->
        <section class="card">
            <h2>Registrar Libro</h2>
            <form id="libro-form">
                <div class="form-group">
                    <label for="titulo">Título del Libro</label>
                    <input type="text" id="titulo" required placeholder="Ej. Cien años de soledad">
                </div>
                <div class="form-group">
                    <label for="autor">Autor</label>
                    <input type="text" id="autor" required placeholder="Ej. Gabriel García Márquez">
                </div>
                <div class="form-group">
                    <label for="estado">Estado Inicial</label>
                    <select id="estado">
                        <option value="Disponible">Disponible</option>
                        <option value="Prestado">Prestado</option>
                    </select>
                </div>
                <button type="submit" class="btn">Agregar a Biblioteca</button>
            </form>
        </section>

        <!-- Columna Derecha: Tabla de Inventario (Figma: Contenedor Principal / Tabla) -->
        <section class="card">
            <h2>Inventario de Libros</h2>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Título</th>
                            <th>Autor</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-libros">
                        <!-- Los libros se inyectarán aquí dinámicamente con JS -->
                    </tbody>
                </table>
            </div>
        </section>
    </div>
</div>


   <script src="prototipo.js"></script>



</body>
</html>
