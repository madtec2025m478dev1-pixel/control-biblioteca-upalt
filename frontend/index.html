<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Control de Biblioteca</title>
    <!-- Importamos la librería ZXing -->
    <script type="text/javascript" src="https://unpkg.com/@zxing/library@0.19.1/umd/index.min.js"></script>
    <!-- Enlazamos la hoja de estilos externa -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="container">
    <header>
        <h1>Sistema de Control de Biblioteca</h1>
        <p>Módulo de escaneo y registro inteligente - UPALT.</p>
    </header>

    <div class="dashboard">
        <!-- COLUMNA IZQUIERDA -->
        <div class="columna-izquierda">
            
            <!-- TARJETA: ESCÁNER DE CÓDIGOS -->
            <section class="card">
                <h2 style="margin-top: 0;">Escanear Libro</h2>
                <p style="font-size: 14px; color: #666;">Usa tu cámara web o celular para identificar un libro rápido.</p>
                
                <div id="video-container">
                    <video id="video"></video>
                </div>
                <button id="btn-iniciar-scanner" class="btn btn-scan">Encender Cámara 📷</button>
                <div id="resultado-escaner"></div>
            </section>

            <!-- TARJETA: FORMULARIO -->
            <section class="card">
                <h2 style="margin-top: 0;">Registro Manual</h2>
                <form id="libro-form">
                    <div class="form-group">
                        <label for="codigo">Código (Barras/QR)</label>
                        <input type="text" id="codigo" required placeholder="Ej. 798765484656">
                    </div>
                    <div class="form-group">
                        <label for="titulo">Título del Libro</label>
                        <input type="text" id="titulo" required placeholder="Ej. Cien años de soledad">
                    </div>
                    <div class="form-group">
                        <label for="autor">Autor</label>
                        <input type="text" id="autor" required placeholder="Ej. Gabriel García Márquez">
                    </div>
                    <button type="submit" class="btn">Agregar a Biblioteca</button>
                </form>
            </section>
        </div>

        <!-- COLUMNA DERECHA: INVENTARIO -->
        <section class="card">
            <h2 style="margin-top: 0;">Inventario de Libros</h2>
            <div style="overflow-x: auto;">
                <table>
                    <thead>
                        <tr>
                            <th>Código</th>
                            <th>Título</th>
                            <th>Autor</th>
                            <th>Estado</th>
                        </tr>
                    </thead>
                    <tbody id="tabla-libros">
                        <!-- Los libros se inyectarán aquí -->
                    </tbody>
                </table>
            </div>
        </section>
    </div>
</div>

<!-- Enlazamos los scripts externos al final del body -->
<script src="js/app.js"></script>
<script src="js/scanner.js"></script>

</body>
</html>
